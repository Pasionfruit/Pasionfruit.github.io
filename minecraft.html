<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Control Dashboard | Pasionfruit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Match the main site's saved theme before first paint.
      ;(function () {
        var stored = ''
        try {
          stored = window.localStorage.getItem('theme-mode') || ''
        } catch (err) {}
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <script type="module" src="/src/minecraft/main.ts"></script>
  </head>
  <body class="app-shell minecraft-page">
    <header class="topbar">
      <a href="/" class="brand" aria-label="Go to home page">
        <span class="brand-mark">PF</span>
        <span class="brand-copy">
          <strong>Pasionfruit</strong>
          <small>Living with Passion</small>
        </span>
      </a>
      <nav aria-label="Site">
        <a class="secondary-action" href="/">Back to Home</a>
      </nav>
    </header>

    <main class="page-shell">
      <div class="admin-page minecraft-dashboard">
        <header class="admin-page-head">
          <p class="eyebrow">Gaming</p>
          <h1>Control Dashboard</h1>
        </header>

        <p id="connectivity-banner" class="connectivity-banner" role="status" aria-live="polite" hidden>
          Server manager unavailable
        </p>

        <section class="info-card server-card" aria-labelledby="server-heading">
          <h2 id="server-heading" class="dashboard-card-title">Minecraft Server</h2>

          <dl class="server-summary">
            <div class="server-summary-item">
              <dt>Status</dt>
              <dd id="server-status">—</dd>
            </div>
            <div class="server-summary-item">
              <dt>Players</dt>
              <dd id="server-players">— / —</dd>
            </div>
            <div class="server-summary-item">
              <dt>Server Version</dt>
              <dd id="server-version">—</dd>
            </div>
          </dl>

          <div class="server-controls">
            <button type="button" id="btn-start" class="primary-action" disabled>Start Server</button>
            <button type="button" id="btn-restart" class="secondary-action" disabled>Restart Server</button>
            <button type="button" id="btn-stop" class="secondary-action danger" disabled>Stop Server</button>
          </div>

          <p id="action-message" class="action-message" role="status" aria-live="polite"></p>
        </section>

        <section class="metrics" aria-label="Server metrics">
          <article class="info-card metric-card">
            <h2 class="dashboard-card-title">CPU Usage</h2>
            <p id="metric-cpu" class="metric-value">—</p>
          </article>
          <article class="info-card metric-card">
            <h2 class="dashboard-card-title">RAM Usage</h2>
            <p id="metric-ram" class="metric-value">—</p>
          </article>
          <article class="info-card metric-card">
            <h2 class="dashboard-card-title">Uptime</h2>
            <p id="metric-uptime" class="metric-value">—</p>
          </article>
        </section>

        <section class="info-card console-card" aria-labelledby="console-heading">
          <h2 id="console-heading" class="dashboard-card-title">Console</h2>
          <pre id="console-window" class="console-window" tabindex="0" aria-label="Latest server log lines"></pre>
        </section>
      </div>
    </main>
  </body>
</html>
