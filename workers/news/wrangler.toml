name = "news"
main = "worker.js"
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origins allowed to call the worker, comma separated (same list as db and ace).
ALLOWED_ORIGINS = "https://abepasion.com,https://www.abepasion.com,http://localhost:5173,http://localhost:5174,http://localhost:5175"

# No secrets. Callers are verified by the db Worker's /auth/verify through this
# binding, so the auth secrets live only on db and ace. Deploy db first.
[[services]]
binding = "DB_API"
service = "db"

[observability]
enabled = true
head_sampling_rate = 1
