name = "db"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
ALLOWED_ORIGINS = "https://abepasion.com,https://www.abepasion.com,http://localhost:5173,http://localhost:5174,http://localhost:5175"

# Secrets (npx wrangler secret put NAME):
#   ADMIN_EMAIL       pasionabe@gmail.com
#   GOOGLE_CLIENT_ID  same web client id the site signs in with

[[d1_databases]]
binding = "DB"
database_name = "pasion-db"
database_id = "f8d1ee38-8bee-4dd2-b62e-d13578b9c4d3"

# The Ciara timeline's photos (workers/db/photos.js). Disabled until R2 is
# enabled on the account (the deploy fails on a bucket that does not exist);
# /photos/* answers 500 meanwhile. To turn on: enable R2 in the dashboard, then
#   npx wrangler r2 bucket create pasion-photos
# and uncomment:
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "pasion-photos"
